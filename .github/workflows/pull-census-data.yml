name: Pull Census demographics

on:
  workflow_dispatch:
    inputs:
      acs_year:
        description: "ACS 5-Year vintage to pull (e.g. 2023)"
        required: false
        default: "2023"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl shapely

      - name: Pull ACS demographics for all ZIPs
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          CENSUS_ACS_YEAR: ${{ inputs.acs_year }}
        run: |
          if [ -z "$CENSUS_API_KEY" ]; then
            echo "::error::CENSUS_API_KEY repo secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          python3 scripts/pull_census_demographics.py

      - name: Rebuild public/data
        run: python3 scripts/build_data.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/source/demographics_full.json public/data/demographics.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Pull full ACS demographic coverage via Census API"
          git push origin HEAD:${{ github.ref_name }}
